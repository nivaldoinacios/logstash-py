[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystash"
version = "0.1.0"
description = "Python Logstash-inspired event pipeline"
requires-python = ">=3.12"

[project.scripts]
pystash = "pystash.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
